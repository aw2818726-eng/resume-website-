double spacing.</p><div class="panel"><div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Choose a spreadsheet file, or drop one here">Drop a .xlsx or .csv file here, or click to browse<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" tabindex="-1"></div><p id="fileError" role="alert" style="color:#FF8A80;margin:12px 0 0;display:none"></p><div id="fileInfo"></div></div><div id="diagArea" style="display:none;"><div class="panel"><h2>Diagnostics</h2><div id="diagList"></div></div><div class="panel"><h2>Preview</h2><div style="overflow-x:auto;"><table id="previewTable"></table></div></div><div class="panel"><span id="summaryText"></span><br><br><button class="btn" id="downloadBtn">Clean &amp; Download</button></div></div><p class="mini-foot"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p></main><script>let rawRows=[];let workbookName='cleaned-data';const diagKeys=['dupes','emptyRC','whitespace','mixedTypes','doubleSpace'];const diagMeta={dupes:{name:'Duplicate rows'},emptyRC:{name:'Empty rows/columns'},whitespace:{name:'Whitespace issues'},mixedTypes:{name:'Mixed data types'},doubleSpace:{name:'Double spacing'}};let diagResults={};let toggles={dupes:true,emptyRC:true,whitespace:true,mixedTypes:true,doubleSpace:true};const dropzone=document.getElementById('dropzone');const fileInput=document.getElementById('fileInput');function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const MAX_BYTES=10*1024*1024;const errEl=document.getElementById('fileError');
function showError(msg){errEl.textContent=msg;errEl.style.display='block';document.getElementById('diagArea').style.display='none';document.getElementById('fileInfo').style.display='none';rawRows=[];}
function clearError(){errEl.textContent='';errEl.style.display='none';}
dropzone.addEventListener('click',()=>fileInput.click());
dropzone.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click();}});
['dragenter','dragover'].forEach(t=>dropzone.addEventListener(t,e=>{e.preventDefault();dropzone.classList.add('drag');}));
['dragleave','drop'].forEach(t=>dropzone.addEventListener(t,e=>{e.preventDefault();dropzone.classList.remove('drag');}));
dropzone.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handleFile(f);});
fileInput.addEventListener('change',e=>{if(e.target.files.length)handleFile(e.target.files[0]);fileInput.value='';});
function handleFile(file){
clearError();
if(!/\.(xlsx|xls|csv)$/i.test(file.name)){showError('That file type is not supported. Please choose a .xlsx, .xls or .csv file.');return;}
if(file.size===0){showError('That file is empty.');return;}
if(file.size>MAX_BYTES){showError('That file is too large ('+(file.size/1048576).toFixed(1)+' MB). Please choose a file under 10 MB.');return;}
if(typeof XLSX==='undefined'){showError('The spreadsheet library could not be loaded. Check your connection and reload the page.');return;}
workbookName=file.name.replace(/\.[^.]+$/,'')+'-cleaned';
const reader=new FileReader();
reader.onerror=()=>showError('The file could not be read. Please try again.');
reader.onload=(e)=>{try{const data=new Uint8Array(e.target.result);const wb=XLSX.read(data,{type:'array'});if(!wb.SheetNames.length)throw new Error('empty');const sheet=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});if(rows.length<2){showError('No data rows were found. The first row is treated as the header, so the file needs at least one more row.');return;}rawRows=rows;const info=document.getElementById('fileInfo');info.style.display='block';info.innerHTML='<b>'+esc(file.name)+'</b> - '+rawRows.length+' rows loaded';runDiagnostics();}catch(err){showError('This file could not be read as a spreadsheet. It may be damaged or password-protected.');}};
reader.readAsArrayBuffer(file);}
function isEmptyCell(v){return v===null||v===undefined||String(v).trim()==='';}function isNumericLike(v){if(typeof v==='number')return true;if(v===''||v===null||v===undefined)return true;return !isNaN(parseFloat(v))&&isFinite(v);}function runDiagnostics(){const header=rawRows[0]||[];const body=rawRows.slice(1);const colCount=header.length;const seen=new Map();const dupeRowIdx=new Set();body.forEach((row,i)=>{const key=JSON.stringify(row);if(seen.has(key))dupeRowIdx.add(i);else seen.set(key,i);});const emptyRowIdx=new Set();body.forEach((row,i)=>{if(row.every(isEmptyCell))emptyRowIdx.add(i);});const emptyColIdx=new Set();for(let c=0;c<colCount;c++){if(body.every(row=>isEmptyCell(row[c])))emptyColIdx.add(c);}const wsCells=[];const dsCells=[];body.forEach((row,i)=>row.forEach((v,c)=>{if(typeof v==='string'){if(v!==v.trim()&&v.trim()!=='')wsCells.push([i,c]);if(/ {2,}/.test(v.trim()))dsCells.push([i,c]);}}));const mixedCells=[];for(let c=0;c<colCount;c++){const vals=body.map(r=>r[c]).filter(v=>!isEmptyCell(v));if(!vals.length)continue;const numericCount=vals.filter(isNumericLike).length;if(numericCount/vals.length>=0.7&&numericCount<vals.length){body.forEach((row,i)=>{if(!isEmptyCell(row[c])&&!isNumericLike(row[c]))mixedCells.push([i,c]);});}}diagResults={dupes:{count:dupeRowIdx.size,rows:dupeRowIdx},emptyRC:{count:emptyRowIdx.size+emptyColIdx.size,rows:emptyRowIdx,cols:emptyColIdx},whitespace:{count:wsCells.length,cells:wsCells},mixedTypes:{count:mixedCells.length,cells:mixedCells},doubleSpace:{count:dsCells.length,cells:dsCells}};renderDiagList();renderPreview(header,body);document.getElementById('diagArea').style.display='block';updateSummary();}function renderDiagList(){const list=document.getElementById('diagList');list.innerHTML='';diagKeys.forEach(key=>{const r=diagResults[key];const meta=diagMeta[key];const div=document.createElement('div');div.innerHTML=`<label><input type="checkbox" data-key="${key}" ${toggles[key]?'checked':''} ${r.count?'':'disabled'}> ${meta.name}: ${r.count} found</label>`;list.appendChild(div);});list.querySelectorAll('input[type=checkbox]').forEach(cb=>{cb.addEventListener('change',()=>{toggles[cb.dataset.key]=cb.checked;updateSummary();});});}function renderPreview(header,body){const table=document.getElementById('previewTable');const flagSet=new Set();['whitespace','mixedTypes','doubleSpace'].forEach(k=>(diagResults[k].cells||[]).forEach(([r,c])=>flagSet.add(r+':'+c)));const rowsToShow=body.slice(0,12);let html='<tr>'+header.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>';rowsToShow.forEach((row,i)=>{const isDupe=diagResults.dupes.rows.has(i);const isEmptyRow=diagResults.emptyRC.rows.has(i);html+='<tr>'+header.map((_,c)=>{const flagged=flagSet.has(i+':'+c)||isDupe||isEmptyRow;return `<td class="${flagged?'flag':''}">${esc(row[c])}</td>`;}).join('')+'</tr>';});table.innerHTML=html;}function updateSummary(){const activeFixes=diagKeys.filter(k=>toggles[k]&&diagResults[k].count);document.getElementById('summaryText').textContent=activeFixes.length?`${activeFixes.length} fixes selected`:'No fixes selected';}document.getElementById('downloadBtn').addEventListener('click',()=>{if(!rawRows.length||typeof XLSX==='undefined')return;let header=rawRows[0].slice();let body=rawRows.slice(1).map(r=>r.slice());if(toggles.whitespace)body.forEach(row=>row.forEach((v,c)=>{if(typeof v==='string')row[c]=v.trim();}));if(toggles.doubleSpace)body.forEach(row=>row.forEach((v,c)=>{if(typeof v==='string')row[c]=v.replace(/ {2,}/g,' ').trim();}));if(toggles.dupes){const seen=new Set();const out=[];body.forEach(row=>{const key=JSON.stringify(row);if(!seen.has(key)){seen.add(key);out.push(row);}});body=out;}if(toggles.emptyRC){body=body.filter(row=>!row.every(isEmptyCell));const keepCols=[];for(let c=0;c<header.length;c++){if(!body.every(row=>isEmptyCell(row[c])))keepCols.push(c);}header=keepCols.map(c=>header[c]);body=body.map(row=>keepCols.map(c=>row[c]));}const ws=XLSX.utils.aoa_to_sheet([header,...body]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Cleaned');XLSX.writeFile(wb,workbookName+'.xlsx');});</script><script src="site.js" defer data-privacy="privacy.html"></script></body></html>
