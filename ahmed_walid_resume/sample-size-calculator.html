<style>body{font-family:sans-serif;background:#14171A;color:#E7E9EA;margin:0;padding:24px;}a{color:#E8A33D;}.wrap{max-width:700px;margin:0 auto;}.panel{background:#1D2226;border:1px solid #2B3136;border-radius:10px;padding:20px;margin-bottom:16px;}.tab{padding:8px 14px;background:#1D2226;border:1px solid #2B3136;border-radius:999px;cursor:pointer;display:inline-block;margin:4px;}.tab.active{background:#E8A33D;color:#14171A;}input,select{width:100%;padding:8px;margin:6px 0 14px;background:#14171A;color:#E7E9EA;border:1px solid #2B3136;border-radius:6px;}.result{text-align:center;font-size:32px;color:#E8A33D;font-weight:700;}html{-webkit-text-size-adjust:100%}*,*::before,*::after{box-sizing:border-box}.wrap>a:first-child{display:inline-block;padding:13px 0}input,select{font-size:16px;min-height:44px}.tab{padding:12px 14px}@media (max-width:600px){body{padding:16px}h1{font-size:24px;line-height:1.25}.panel{padding:16px}.result{font-size:28px}}.mini-foot{margin:28px 0 0;font-size:13px;text-align:center}.mini-foot a{display:inline-block;padding:15px 10px}a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid #E8A33D;outline-offset:3px}.skip-link{position:absolute;left:-9999px;top:8px}.skip-link:focus{left:12px;z-index:300;background:#E8A33D;color:#14171A;padding:10px 14px;border-radius:6px;text-decoration:none}</style></head><body><a class="skip-link" href="#main">Skip to content</a><main class="wrap" id="main"><a href="index.html">← Back to portfolio</a><h1>Sample Size Calculator</h1><p>Solve for required sample size or margin of error, for proportion- or mean-based estimates.</p><div class="panel"><div><span class="tab active" data-est="proportion">Proportion-based</span><span class="tab" data-est="mean">Mean-based</span></div><div><span class="tab active" data-solve="n">Solve for n</span><span class="tab" data-solve="e">Solve for margin</span></div><label>Confidence level<select id="confidence"><option value="1.645">90%</option><option value="1.96" selected>95%</option><option value="2.576">99%</option></select></label><div id="propField"><label>Estimated proportion (p)<input type="number" id="prop" value="0.5" step="0.01"></label></div><div id="stdField" style="display:none;"><label>Std deviation<input type="number" id="stdDev" value="10" step="0.1"></label></div><div id="nField" style="display:none;"><label>Sample size (n)<input type="number" id="sampleN" value="100" step="1"></label></div><div id="eField"><label>Margin of error<input type="number" id="marginE" value="0.05" step="0.001"></label></div></div><div class="panel"><div class="result" id="resultNum" aria-live="polite">—</div><p id="calcErr" role="alert" style="color:#FF8A80;text-align:center;margin:8px 0 0"></p><div style="text-align:center;" id="resultLbl"></div></div><p class="mini-foot"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p></main><script>let est='proportion';let solve='n';document.querySelectorAll('[data-est]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-est]').forEach(x=>x.classList.remove('active'));b.classList.add('active');est=b.dataset.est;document.getElementById('propField').style.display=est==='proportion'?'block':'none';document.getElementById('stdField').style.display=est==='mean'?'block':'none';compute();}));document.querySelectorAll('[data-solve]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-solve]').forEach(x=>x.classList.remove('active'));b.classList.add('active');solve=b.dataset.solve;document.getElementById('nField').style.display=solve==='e'?'block':'none';document.getElementById('eField').style.display=solve==='n'?'none':'block';compute();}));document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',compute));function val(id){const el=document.getElementById(id);const raw=el.value.trim();return {el:el,v:raw===''?NaN:Number(raw)};}
function compute(){const z=parseFloat(document.getElementById('confidence').value);const errs=[];
document.querySelectorAll('input').forEach(i=>i.removeAttribute('aria-invalid'));
const P=val('prop'),S=val('stdDev'),N=val('sampleN'),E=val('marginE');
function need(x,ok,msg){if(!ok){errs.push(msg);x.el.setAttribute('aria-invalid','true');}}
if(est==='proportion')need(P,isFinite(P.v)&&P.v>0&&P.v<1,'Proportion (p) must be a number between 0 and 1 (not including 0 or 1).');else need(S,isFinite(S.v)&&S.v>0,'Standard deviation must be a number greater than 0.');
if(solve==='n'){need(E,isFinite(E.v)&&E.v>0&&(est==='mean'||E.v<1),est==='proportion'?'Margin of error must be greater than 0 and less than 1 (for example 0.05 for ±5%).':'Margin of error must be greater than 0.');}
else{need(N,isFinite(N.v)&&Number.isInteger(N.v)&&N.v>=1,'Sample size (n) must be a whole number of at least 1.');}
const out=document.getElementById('resultNum'),lbl=document.getElementById('resultLbl'),er=document.getElementById('calcErr');
if(errs.length){out.textContent='—';lbl.textContent='';er.textContent=errs.join(' ');return;}
er.textContent='';let resultNum,resultLbl;
if(solve==='n'){resultNum=est==='proportion'?Math.ceil((z*z*P.v*(1-P.v))/(E.v*E.v)):Math.ceil(Math.pow((z*S.v)/E.v,2));resultLbl='Required sample size';}
else{resultNum=(est==='proportion'?z*Math.sqrt((P.v*(1-P.v))/N.v):z*S.v/Math.sqrt(N.v)).toFixed(4);resultLbl='Resulting margin of error';}
out.textContent=resultNum;lbl.textContent=resultLbl;}
compute();</script><script src="site.js" defer data-privacy="privacy.html"></script></body></html>
